[policies.MalwareBlock]
prefix              = "L_MalwareBlock"
name                = "Malware Block"
action              = "block"
type                = "DOMAIN"
use_spam_tld        = false
ip_categories       = true
include             = ["HaGeZi TIF Full"]
exclude             = []
# C2/Botnets (178), Malware (80), Spyware (187), Crypto (176), DNS Tunneling (175), DGA (117), Private IP (153)
security_categories = [178, 80, 187, 176, 175, 117, 153]
content_categories  = []

[policies.NewDomainBlock]
prefix              = "L_NewDomainBlock"
name                = "New Domain Block"
action              = "block"
type                = "DOMAIN"
use_spam_tld        = false
ip_categories       = false
include             = []
exclude             = []
# Phishing (83), Brand Embedding (131), Compromised Domains (134)
security_categories = [83, 131, 134]
# Domain age & grayware content categories:
content_categories  = [32, 169, 177, 128]

[policies.social]
prefix              = "L_Social"
name                = "Social Block Isaac"
action              = "block"
type                = "DOMAIN"
restrict_users      = true
use_spam_tld        = false
include             = ["HaGeZi Social"]
exclude             = []
security_categories = []
content_categories  = []
app_ids             = [
    534, 541, 572, 600, 604, 618, 628, 633, 1110, 1122, 1130, 1135, 1138,
    1853, 2678, 2680, 2826, 2831, 2844, 2845, 2848, 2852, 3097, 3098
]
domains             = ["web.archive.org", "linkvertise.com", "rumble.com"]
