#[spam_allow_source]
#name      = "HaGeZi Spam Allow"
#url       = "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/spam-tlds-allow-onlydomains.txt"
#relevance = false

[policies.relaxed]
prefix              = "L_Relaxed"
name                = "AdBlock HaGeZi Normal"
action              = "block"
type                = "DOMAIN"
use_spam_tld        = false
include             = ["HaGeZi Normal", "HaGeZi No SafeSearch"]
exclude             = []
security_categories = []
content_categories  = []
domains             = []

