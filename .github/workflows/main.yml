name: Cloudflare Gateway Sync

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 tomli

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Relevance Dataset
        uses: actions/cache@v4
        with:
          path: .relevance_cache.gz
          key: relevance-cache-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            relevance-cache-${{ runner.os }}-

      - name: Execute Sync Script
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          PRIMARY_EMAIL: ${{ secrets.PRIMARY_EMAIL }}
          SECONDARY_EMAIL: ${{ secrets.SECONDARY_EMAIL }}
          TERTIARY_EMAIL: ${{ secrets.TERTIARY_EMAIL }}
          EXCLUDED_EMAILS: ${{ secrets.EXCLUDED_EMAILS }}
        run: python block_ads_sync.py
