name: Cloudflare Gateway Sync

on:
  schedule:
    - cron: '0 1,13 * * *' 
  workflow_dispatch:

concurrency:
  group: cloudflare-sync
  cancel-in-progress: false

jobs:
  run-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Sync
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          PRIMARY_EMAIL: ${{ secrets.PRIMARY_EMAIL }}
          SECONDARY_EMAIL: ${{ secrets.SECONDARY_EMAIL }}
          TERTIARY_EMAIL: ${{ secrets.TERTIARY_EMAIL }}
          EXCLUDED_EMAILS: ${{ secrets.EXCLUDED_EMAILS }}
        run: python3 block_ads_sync.py
