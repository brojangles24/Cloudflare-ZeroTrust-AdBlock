name: Cloudflare Gateway Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-gateway-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/target/
          key: rust-script-${{ runner.os }}-${{ hashFiles('block_ads_sync.rs') }}
          restore-keys: |
            rust-script-${{ runner.os }}-

      - name: Execute Sync Script
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          PRIMARY_EMAIL: ${{ secrets.PRIMARY_EMAIL }}
          SECONDARY_EMAIL: ${{ secrets.SECONDARY_EMAIL }}
          TERTIARY_EMAIL: ${{ secrets.TERTIARY_EMAIL }}
          EXCLUDED_EMAILS: ${{ secrets.EXCLUDED_EMAILS }}
        run: cargo +nightly -Zscript block_ads_sync.rs
